<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SICEP · Productos de energía</title>
<script defer src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{--bg:#fcfcfb;--surface:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e6e6e3;--accent:#2E6FB0;
    --ok:#1E8E5A;--warn:#9a6412;--crit:#C0392B;--info:#2E6FB0}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}header .sub{color:var(--muted);font-size:12px}
  nav a{margin-left:14px;color:var(--accent);text-decoration:none;font-weight:600}
  .wrap{padding:16px 20px;max-width:1500px;margin:0 auto}
  .filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px}
  .f{display:flex;flex-direction:column;gap:3px}
  .f label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  input,select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;background:var(--surface);min-width:120px}
  input[type=search]{min-width:220px}
  .chk{flex-direction:row;align-items:center;gap:6px}
  button{padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:var(--surface);color:var(--accent)}
  .count{color:var(--muted);margin:6px 2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;min-width:0}
  .chips .fl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;min-width:52px}
  .chips button{border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:999px;padding:4px 12px;font-weight:500;font-size:13px}
  .na{color:var(--muted)}
  .chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  #panel{margin-top:6px}
  #panel .tb .graficos{grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr))}
  input[type=checkbox]{min-width:0;padding:0;margin:0;width:auto}
  .f.chk{align-self:center;padding-top:16px}.f.chk label{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}
  @media (max-width:520px){.wrap{padding:12px}header{padding:10px 12px}input[type=search]{min-width:0;width:100%}.f{flex:1 1 140px;min-width:0}
    input,select{min-width:0;width:100%}nav a{margin-left:0;margin-right:14px}}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f4f4f2;font-size:11px;text-transform:uppercase;color:#41474e;cursor:pointer}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#f7faff}
  a.conv{color:var(--accent);text-decoration:none;font-weight:700}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .st-adj{background:#e4f3ea;color:var(--ok)}.st-des{background:#fbeed7;color:var(--warn)}
  .st-can{background:#fbe6e4;color:var(--crit)}.st-abi{background:#e3eefb;color:var(--info)}
  .pag{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0}
</style></head>
<body>
<header><div><h1>SICEP · Productos de energía</h1><div class="sub">Datos públicos de sicep.xm.com.co · <span id="meta"></span></div></div>
  <nav><a href="index.html">Productos</a><a href="bolsa.html">Precio de bolsa</a></nav></header>
<div class="wrap">
  <div class="chips" id="chips-e" role="group" aria-label="Estado"><span class="fl">Estado</span></div>
  <div class="chips" id="chips-a" role="group" aria-label="Año"><span class="fl">Año</span></div>
  <div class="chips" id="chips-c" role="group" aria-label="Tipo de curva"><span class="fl" title="Forma de la demanda horaria según el anexo del pliego (convocatorias 2025–2026 y abiertas)">Curva</span></div>
  <div class="chips" id="chips-d" role="group" aria-label="Duración del contrato"><span class="fl">Duración</span></div>
  <div class="filtros">
    <div class="f"><label for="q">Buscar</label><input id="q" type="search" placeholder="convocatoria, agente, producto…"></div>
    <div class="f"><label for="agente">Agente comprador</label><select id="agente"><option value="">Todos</option></select></div>
    <div class="f"><label for="mercado">Mercado</label><select id="mercado"><option value="">Todos</option></select></div>
    <div class="f chk"><input type="checkbox" id="adj"><label for="adj">Solo adjudicados</label></div>
    <button class="ghost" onclick="limpiar()">Limpiar</button>
  </div>
  <div id="panel"></div>
  <div class="count" id="count">Cargando datos…</div>
  <div style="overflow-x:auto"><table>
    <thead><tr>
      <th onclick="sort('convocatoria')">Convocatoria</th><th>Producto</th>
      <th onclick="sort('anio')">Año</th><th>Estado</th><th>Comprador</th>
      <th onclick="sort('energia_demandada_gwh')">Demandada GWh</th>
      <th onclick="sort('energia_adjudicada_gwh')">Adjudicada GWh</th>
      <th onclick="sort('precio_prom_adjudicado')">Precio $/kWh</th>
      <th onclick="sort('anios_contrato')">Años</th><th onclick="sort('_curva')">Curva</th><th>Suministro</th>
      <th>Tipo contrato</th><th>Ofertas r/a</th>
    </tr></thead><tbody id="tb"></tbody></table></div>
  <div class="pag"><button class="ghost" onclick="mover(-1)">← Anterior</button>
    <span id="pageinfo"></span><button class="ghost" onclick="mover(1)">Siguiente →</button></div>
</div>
<script src="tablero.js"></script>
<script src="panel.js"></script>
<script>
let DATA=[], view=[], page=1, order="anio", asc=false, rows=30, CURVAS=null, BOLSA_RES=null;
const ESTADOS=[["abi","Abierta","Abiertas"],["adj","Cerrada y adjudicada","Cerradas adjudicadas"],["des","Cerrada y desierta","Desiertas"],["can","Cancelada","Canceladas"]];
const selE=new Set(), selA=new Set(), selC=new Set(), selD=new Set();
// Tipo de curva de cada producto (data/curva_tipo.json, de exportar_web.py): forma del día ordinario en el anexo del
// pliego — plana 24 h, solar (solo H6–H19), punta (solo desde H17), variable — o, si no hay curva, por qué no la hay.
const CURVA_TXT={plana:"Plana 24 h",solar:"Solar (diurna)",punta:"Punta (noche)",variable:"Variable (perfil)",
  anexo:"Sin curva: anexo no leído",pliego:"Sin curva: pliego no procesado"};
const CURVA_TIP={anexo:"El pliego se procesó, pero su anexo no trae la curva de este producto o no se pudo leer. Tiene su energía de SICEP, pero no su forma hora a hora.",
  pliego:"El pliego de esta convocatoria no se procesó (canceladas, sin archivos en SICEP o fuera del alcance). Tiene su energía de SICEP, pero no su forma hora a hora."};
// Duración del contrato en años (anios_contrato de SICEP).
const DURACION=[["d0","< 1 año",a=>a<0.95],["d1","1 año",a=>a>=0.95&&a<=1.05],["d13","1–3 años",a=>a>1.05&&a<=3],
  ["d35","3–5 años",a=>a>3&&a<=5],["d510","5–10 años",a=>a>5&&a<=10],["d10","> 10 años",a=>a>10]];
const duracion=a=>{if(a==null||a==="")return null;const x=+a;const d=DURACION.find(([, ,f])=>f(x));return d?d[0]:null;};
const stCls=s=>({"Cerrada y adjudicada":"st-adj","Cerrada y desierta":"st-des","Cancelada":"st-can","Abierta":"st-abi"}[s]||"");
const n=(v,d=2)=>v==null?"—":Number(v).toLocaleString("es",{minimumFractionDigits:d,maximumFractionDigits:d});
const yr=s=>s?String(s).slice(0,4):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
function opts(sel,vals){vals.filter(v=>v!=null&&v!=="").sort().forEach(v=>sel.append(new Option(v,v)))}
function chips(id,items,sel){  // items: [[valor, texto]]
  const el=$(id);
  el.querySelectorAll("button").forEach(b=>b.remove());
  items.forEach(([v,t])=>{const b=document.createElement("button");b.type="button";b.dataset.v=v;b.textContent=t;
    b.setAttribute("aria-pressed",sel.has(v));el.append(b);});
  el.onclick=ev=>{const b=ev.target.closest("button");if(!b)return;const v=b.dataset.v;
    sel.has(v)?sel.delete(v):sel.add(v);b.setAttribute("aria-pressed",sel.has(v));aplicar();};
}
function filtrar(){
  const q=$("q").value.toLowerCase(),ag=$("agente").value,m=$("mercado").value,adj=$("adj").checked;
  const est=new Set(ESTADOS.filter(e=>selE.has(e[0])).map(e=>e[1]));
  return DATA.filter(r=>{
    if(q&&!((r.convocatoria||"")+(r.agente_comprador||"")+(r.producto||"")).toLowerCase().includes(q))return false;
    if(selA.size&&!selA.has(String(r.anio)))return false;
    if(est.size&&!est.has(r.estado))return false;
    if(ag&&r.agente_comprador!==ag)return false;
    if(m&&r.mercado!==m)return false;
    if(adj&&r.energia_adjudicada_gwh==null)return false;
    if(selC.size&&!selC.has(r._curva))return false;
    if(selD.size&&!selD.has(duracion(r.anios_contrato)))return false;
    return true;});
}
// Filtros en el enlace: ?e=adj,abi&a=2025,2026&ag=..&m=..&q=..&sa=1 (el panel agrega b= para la bolsa)
function aUrl(){
  const U=window.TableroUtil;if(!U)return;
  U.selAUrl(null,"e",ESTADOS.map(e=>e[0]).filter(k=>selE.has(k)));
  U.selAUrl(null,"a",[...selA].sort());
  U.selAUrl(null,"ag",$("agente").value?[$("agente").value]:[]);
  U.selAUrl(null,"m",$("mercado").value?[$("mercado").value]:[]);
  U.selAUrl(null,"q",$("q").value.trim()?[$("q").value.trim()]:[]);
  U.selAUrl(null,"sa",$("adj").checked?["1"]:[]);
  U.selAUrl(null,"c",Object.keys(CURVA_TXT).filter(k=>selC.has(k)));
  U.selAUrl(null,"d",DURACION.map(d=>d[0]).filter(k=>selD.has(k)));
}
function deUrl(){
  const u=new URLSearchParams(location.search),lista=k=>(u.get(k)||"").split(",").filter(Boolean);
  lista("e").forEach(v=>selE.add(v));lista("a").forEach(v=>selA.add(v));
  lista("c").forEach(v=>selC.add(v));lista("d").forEach(v=>selD.add(v));
  const pon=(id,v)=>{if(v&&[...$(id).options].some(o=>o.value===v))$(id).value=v;};
  pon("agente",u.get("ag"));pon("mercado",u.get("m"));
  $("q").value=u.get("q")||"";$("adj").checked=u.get("sa")==="1";
}
function aplicar(){
  view=filtrar();aUrl();
  try{if(window.renderPanel)renderPanel($("panel"),{productos:view,curvas:CURVAS,bolsaResumen:BOLSA_RES,base:"data/"});}catch(e){console.error(e);}
  render(1);
}
function render(p){
  page=p||page;
  view.sort((x,y)=>{let vx=x[order],vy=y[order];vx=vx==null?-Infinity:vx;vy=vy==null?-Infinity:vy;
    if(typeof vx==="string")return asc?String(vx).localeCompare(vy):String(vy).localeCompare(vx);
    return asc?vx-vy:vy-vx;});
  $("count").textContent=`${view.length.toLocaleString("es")} producto${view.length===1?"":"s"}`;
  const off=(page-1)*rows, pg=view.slice(off,off+rows);
  $("tb").innerHTML=pg.map(c=>`<tr>
    <td><a class="conv" href="ficha.html?c=${encodeURIComponent(c.convocatoria)}">${esc(c.convocatoria)}</a></td>
    <td>${esc((c.producto||"").split("-").pop())}</td><td>${esc(c.anio??"")}</td>
    <td><span class="pill ${stCls(c.estado)}">${esc((c.estado||"").replace("Cerrada y ",""))}</span></td>
    <td>${esc(c.agente_comprador??"")}</td>
    <td class="num">${n(c.energia_demandada_gwh)}</td><td class="num">${n(c.energia_adjudicada_gwh)}</td>
    <td class="num">${c.precio_prom_adjudicado>0?n(c.precio_prom_adjudicado):"—"}</td><td class="num">${esc(c.anios_contrato??"—")}</td>
    <td>${CURVA_TIP[c._curva]?`<span class="na" title="${esc(CURVA_TIP[c._curva])}">${c._curva==="anexo"?"anexo no leído":"pliego no procesado"}</span>`:esc(CURVA_TXT[c._curva]||"—")}</td>
    <td>${esc(yr(c.inicio_obligacion))}–${esc(yr(c.fin_obligacion))}</td>
    <td>${esc(c.tipo_contrato||"—")}</td>
    <td class="num">${esc(c.ofertas_recibidas??"—")}/${esc(c.ofertas_adjudicadas??"—")}</td></tr>`).join("");
  $("pageinfo").textContent=`Página ${page} de ${Math.max(1,Math.ceil(view.length/rows))}`;
}
function mover(d){const pg=Math.ceil(view.length/rows);page=Math.min(Math.max(1,page+d),pg||1);render(page)}
function sort(c){if(order===c)asc=!asc;else{order=c;asc=false}render(1)}
function limpiar(){$("q").value="";["agente","mercado"].forEach(i=>$(i).value="");$("adj").checked=false;
  selE.clear();selA.clear();selC.clear();selD.clear();document.querySelectorAll(".chips button").forEach(b=>b.setAttribute("aria-pressed","false"));aplicar()}
let tq=null;
$("q").addEventListener("input",()=>{clearTimeout(tq);tq=setTimeout(aplicar,250)});
["agente","mercado","adj"].forEach(i=>$(i).addEventListener("change",aplicar));
const json=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
const pCurvas=json("data/curvas.json"), pBolsa=json("data/bolsa_resumen.json"), pTipos=json("data/curva_tipo.json");
Promise.all([fetch("data/productos.json").then(r=>r.json()),pCurvas,pBolsa,pTipos]).then(([d,cu,br,ti])=>{DATA=d;CURVAS=cu;BOLSA_RES=br;
  d.forEach(r=>{r._curva=(ti||{})[r.producto]||"pliego";});
  opts($("agente"),[...new Set(d.map(r=>r.agente_comprador))]);
  opts($("mercado"),[...new Set(d.map(r=>r.mercado))]);
  deUrl();
  chips("chips-e",ESTADOS.filter(([,e])=>e!=="Cancelada"||d.some(r=>r.estado===e)).map(([k,,t])=>[k,t]),selE);
  chips("chips-a",[...new Set(d.map(r=>r.anio).filter(a=>a!=null&&+a>=2020).map(String))].sort().map(a=>[a,a]),selA);
  const cuenta=k=>d.filter(r=>r._curva===k).length;
  chips("chips-c",Object.keys(CURVA_TXT).filter(k=>cuenta(k)).map(k=>[k,`${CURVA_TXT[k]} (${cuenta(k).toLocaleString("es")})`]),selC);
  $("chips-c").querySelectorAll("button").forEach(b=>{if(CURVA_TIP[b.dataset.v])b.title=CURVA_TIP[b.dataset.v];});
  chips("chips-d",DURACION.filter(([k])=>d.some(r=>duracion(r.anios_contrato)===k)).map(([k,t])=>[k,t]),selD);
  [[selE,"chips-e"],[selA,"chips-a"],[selC,"chips-c"],[selD,"chips-d"]].forEach(([s,id])=>[...s].forEach(v=>{if(!$(id).querySelector(`button[data-v="${CSS.escape(v)}"]`))s.delete(v);}));
  aplicar();}).catch(()=>{$("count").textContent="No se pudieron cargar los datos.";});
fetch("data/meta.json").then(r=>r.json()).then(m=>{$("meta").textContent="actualizado "+(m.generado||"").slice(0,10)}).catch(()=>{});
</script></body></html>
